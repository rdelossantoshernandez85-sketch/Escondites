 <div class="sl"><label>Volumen</label><input type="range" min="0" max="100" oninput="S.master=this.value/100;applyVol();saveS()" id="pvM"></div>

<script>
/* ================= ESCONDITES · NÚCLEO ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RNG=s=>{let a=s>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const hashStr=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return x;};
const IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const SKEY='escondites_v1';
let S={map:'mansion',master:.8,music:.5,sfx:.8,name:'Jugador',mode:'solo',role:'hide',hiders:4,ex:false,hideT:30,seekT:240,rounds:3,diff:1,fsAuto:true,wins:0,played:0,kills:0,best:0};
let _sv=null;try{_sv=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){}
if(!_sv){try{const w=JSON.parse(window.name||'null');if(w&&w._k===SKEY)_sv=w;}catch(e){}}
if(_sv)S=Object.assign(S,_sv);
const saveS=()=>{const j=JSON.stringify(S);try{localStorage.setItem(SKEY,j);}catch(e){}try{window.name=JSON.stringify(Object.assign({_k:SKEY},S));}catch(e){}};
let toastT=0;
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms||2600);}
const fmt=n=>Math.round(n).toLocaleString('es-MX');
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

/* ================= AUDIO ================= */
let AC=null,gM,gS,gMu,musMode='menu',reverbIn=null;
const MUSKEY='escondites_music';
const MUS={next:0,step:0,el:null,src:null,url:null,name:'',custom:false,nb:null,ready:false};
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();gM=AC.createGain();gM.connect(AC.destination);gS=AC.createGain();gS.connect(gM);
    gMu=AC.createGain();const cpr=AC.createDynamicsCompressor();cpr.threshold.value=-16;cpr.ratio.value=5;gMu.connect(cpr);cpr.connect(gM);
    // reverb sintética
    const n=AC.sampleRate*2.6,ir=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}
    const cv=AC.createConvolver();cv.buffer=ir;reverbIn=AC.createGain();reverbIn.gain.value=.55;reverbIn.connect(cv);cv.connect(cpr);
    applyVol();}catch(e){AC=null;}
}
function applyVol(){if(!AC)return;gM.gain.value=S.master;gS.gain.value=S.sfx;gMu.gain.value=S.music*.6;try{musApply();}catch(e){}}
function tone(f,d,ty,v,t0,f2,dest){
  if(!AC)return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||gS);o.start(t);o.stop(t+d+.03);
}
const NOTE=n=>261.63*Math.pow(2,n/12);
function nbuf(){if(MUS.nb)return MUS.nb;const n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return MUS.nb=b;}
function noise(d,v,type,f,t0,dest,f2){
  if(!AC)return;const t=AC.currentTime+(t0||0),s=AC.createBufferSource();s.buffer=nbuf();s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest||gS);s.start(t,Math.random()*.5);s.stop(t+d+.05);
}
let lastSfx={};
function sfx(n,vol){
  if(!AC)return;const now=AC.currentTime;if(lastSfx[n]&&now-lastSfx[n]<.04)return;lastSfx[n]=now;const v=vol==null?1:vol;
  if(n==='click')tone(520,.06,'triangle',.14*v);
  else if(n==='shot'){noise(.16,.5*v,'lowpass',2400,0,null,300);tone(160,.14,'sawtooth',.3*v,0,40);}
  else if(n==='empty')tone(1500,.04,'square',.09*v);
  else if(n==='reload'){tone(900,.04,'square',.1*v);tone(600,.05,'square',.1*v,.5);tone(1100,.05,'square',.12*v,.95);}
  else if(n==='hit'){tone(220,.18,'sawtooth',.3*v,0,70);noise(.12,.3*v,'bandpass',900);}
  else if(n==='die'){tone(300,.7,'sawtooth',.3*v,0,35);noise(.5,.3*v,'lowpass',700,0,null,120);}
  else if(n==='spark'){noise(.08,.25*v,'highpass',4000);}
  else if(n==='xf'){noise(.22,.3*v,'bandpass',600,0,null,3000);[0,7,12,16].forEach((k,i)=>tone(NOTE(k+12),.1,'triangle',.12*v,i*.04));}
  else if(n==='ping'){tone(700,.5,'sine',.25*v,0,1400);tone(700,.5,'sine',.12*v,.28,1400);}
  else if(n==='blip')tone(1400,.08,'sine',.12*v);
  else if(n==='taunt'){tone(260,.18,'sine',.3*v,0,620);tone(620,.2,'sine',.3*v,.18,300);}
  else if(n==='thunder'){noise(2.2,.9*v,'lowpass',500,0,null,60);noise(.25,.5*v,'highpass',2000);}
  else if(n==='heart'){tone(62,.12,'sine',.5*v,0,38);tone(55,.14,'sine',.4*v,.17,34);}
  else if(n==='creak'){tone(90+Math.random()*60,.7,'sawtooth',.06*v,0,60+Math.random()*30);}
  else if(n==='win')[0,4,7,12,16].forEach((k,i)=>tone(NOTE(k+12),.22,'triangle',.22*v,i*.1));
  else if(n==='lose')[7,3,0,-5].forEach((k,i)=>tone(NOTE(k),.3,'sawtooth',.18*v,i*.16));
  else if(n==='insp'){tone(500,.1,'triangle',.15*v,0,900);}
  else if(n==='lock')tone(300,.07,'square',.12*v,0,180);
  else if(n==='decoy'){tone(800,.1,'triangle',.2*v,0,300);}
  else if(n==='start'){tone(300,.5,'sawtooth',.2*v,0,600);}
}
/* ---------- música ambiental original (sintetizada) ---------- */
const MBPM=70,CH=[{r:-3,t:3},{r:-7,t:4},{r:-10,t:3},{r:-8,t:4}];
function mEnv(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function mOut(g,wet){g.connect(gMu);if(reverbIn&&wet){const w=AC.createGain();w.gain.value=wet;g.connect(w);w.connect(reverbIn);}}
function mBell(t,n,v){const f=NOTE(n);[[1,1],[2.76,.3],[5.4,.12]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;mEnv(g,t,.004,2.2/m+.3,(v||.1)*a);o.connect(g);mOut(g,.7);o.start(t);o.stop(t+2.6);});}
function mPad(t,notes,d,v){notes.forEach((n,i)=>{[0,1].forEach(k=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=k?'sawtooth':'triangle';o.frequency.value=NOTE(n)*(k?1.004:1);fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v*(k?.4:1),t+d*.35);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);mOut(g,.5);o.start(t);o.stop(t+d+.05);});});}
function mDrone(t,n,d,v){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=NOTE(n-12);fl.type='lowpass';fl.frequency.value=180;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.4);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);mOut(g,.2);o.start(t);o.stop(t+d+.05);}
function mThump(t,v){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+.16);mEnv(g,t,.004,.24,v);o.connect(g);mOut(g,.1);o.start(t);o.stop(t+.3);}

  const st=MUS.step++,s=st%16,bar=Math.floor(st/16),c=CH[bar%4],root=c.r,sp=60/MBPM/4,m=musMode;
  const arp=[0,c.t,7,12,7,c.t,0,-5];
  if(s===0){mPad(t,[root,root+c.t,root+7],sp*16,m==='xseek'?.05:.07);if(m!=='menu'&&bar%2===0)mDrone(t,root,sp*32,.16);}

  else if(m==='hide'){if(s%4===0&&Math.random()<.4)mBell(t,root+12+arp[Math.floor(Math.random()*8)],.06);if(s===8&&bar%2)mTick(t,.12);}

    if(s===0||s===3)mThump(t,s?.5:.8);if(s===8||s===11)mThump(t,s===11?.35:.55);
    if(s%4===2)mTick(t,.1);

async function musPick(f){
  if(!f)return;
  if(!(/^audio\//.test(f.type)||/\.(mp3|wav|ogg|m4a|aac|flac|opus|webm)$/i.test(f.name))){toast('Elige un archivo de audio (mp3, wav, ogg, m4a…)');return;}
  if(f.size>80*1024*1024){toast('El archivo es muy grande (máximo 80 MB)');return;}
  try{audioInit();}catch(e){}
  musUse(f,f.name.replace(/\.[^.]+$/,''));
  try{await idbSet(MUSKEY,{blob:f,name:MUS.name});toast('🎵 Música guardada en este dispositivo');}catch(e){toast('🎵 Sonando (no se pudo guardar para la próxima vez)');}
}

}

function loadPeerLib(){
  if(PeerCls)return Promise.resolve(PeerCls);
  if(/[?&]lite\b/.test(location.search)||window.__FORCE_LITE){PeerCls=LitePeer;peerState='lite';return Promise.resolve(PeerCls);}
  if(window.Peer&&window.Peer!==LitePeer){PeerCls=window.Peer;peerState='lib';return Promise.resolve(PeerCls);}
  if(loadPeerLib.p)return loadPeerLib.p;
  loadPeerLib.p=new Promise(res=>{
    let i=0;
    const next=()=>{
      if(i>=PEER_SRCS.length){PeerCls=LitePeer;peerState='lite';res(PeerCls);return;}
      const s=document.createElement('script');s.src=PEER_SRCS[i++];let done=false;
      const to=setTimeout(()=>{if(!done){done=true;try{s.remove();}catch(e){}next();}},5000);
      s.onload=()=>{if(done)return;done=true;clearTimeout(to);if(window.Peer){PeerCls=window.Peer;peerState='lib';res(PeerCls);}else next();};
      s.onerror=()=>{if(done)return;done=true;clearTimeout(to);next();};
      document.head.appendChild(s);
    };
    next();
  });
  return loadPeerLib.p;
}

let DYN=[];
function boxFree(x,y,hw,hh,self,noDyn){
  if(!tilesFree(x,y,hw,hh))return false;
  if(pbNear(x,y,hw,hh,o=>Math.abs(o.x-x)<o.hw+hw&&Math.abs(o.y-y)<o.hh+hh))return false;

function rayWall(x0,y0,dx,dy,maxd){
  let tx=Math.floor(x0/TS),ty=Math.floor(y0/TS);if(tx<0||ty<0||tx>=MW||ty>=MH)return 0;
  const sx=dx>0?1:-1,sy=dy>0?1:-1,ddx=dx!==0?Math.abs(TS/dx):1e9,ddy=dy!==0?Math.abs(TS/dy):1e9;

    if(d>=maxd)return maxd;

  else if(/network|socket|server/.test(t||''))m='No se pudo conectar con el servidor de salas. Revisa tu internet o prueba en otra red.';

const randCode=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s;};
async function createRoom(attempt){
  attempt=attempt||0;if(net.busy&&!attempt)return;
  leaveNet(true);S.mode='online';net.busy=true;try{renderPage();}catch(e){}setNet('Cargando módulo de red…','wait');
  const P=await loadPeerLib();const code=randCode();setNet('Conectando con el servidor de salas…','wait');
  let peer;try{peer=new P(NETPFX+code,{debug:0,config:{iceServers:ICE}});}catch(e){netErr({type:'network'});return;}
  net.peer=peer;
  net.tm=setTimeout(()=>{if(!net.on){try{peer.destroy();}catch(e){}net.peer=null;netErr({type:'network'});}},15000);
  peer.on('disconnected',()=>{if(net.peer!==peer||!net.host)return;setTimeout(()=>{try{if(net.peer===peer&&!peer.destroyed)peer.reconnect();}catch(e){}},600);});
  peer.on('open',()=>{
    if(net.on&&net.host&&net.peer===peer)return;
    clearTimeout(net.tm);net.on=true;net.host=true;net.code=code;net.id=0;MY.id=0;net.next=1;net.busy=false;
    lob.players=[{id:0,name:S.name}];setNet('Sala lista. Comparte el código con tus amigos.','ok');try{renderPage();}catch(e){}
    clearInterval(net.wd);net.wd=setInterval(()=>{try{if(net.peer===peer&&!peer.destroyed&&peer.disconnected)peer.reconnect();}catch(e){}},8000);
  });
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&attempt<4){createRoom(attempt+1);return;}
    if(net.on&&net.host&&net.peer===peer&&e&&/network|socket|server|disconnected/.test(e.type||'')){setTimeout(()=>{try{peer.reconnect();}catch(x){}},1200);return;}
    if(net.on&&net.host&&e&&e.type==='peer-unavailable')return;
    netErr(e);});
  peer.on('connection',c=>{
    if(net.conns.length>=4||started){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),500);});return;}
    c.pid=net.next++;net.conns.push(c);
    c.on('data',m=>hostRecv(c,m));
    c.on('close',()=>{net.conns=net.conns.filter(q=>q!==c);lob.players=lob.players.filter(q=>q.id!==c.pid);if(!started)lobBcast();else{const f=GM&&GM.players.find(p=>p.id===c.pid);if(f){f.remote=false;f.bot=true;f.human=false;f.name+=' (bot)';f.ai=null;}}});
  });
}
async function joinRoom(){
  if(net.busy)return;
  const code=($('joinIn').value||'').trim().toUpperCase();
  if(code.length<4){setNet('Escribe el código de 4 letras de la sala','err');return;}
  leaveNet(true);S.mode='online';net.busy=true;try{renderPage();}catch(e){}setNet('Cargando módulo de red…','wait');
  const P=await loadPeerLib();setNet('Conectando con el servidor de salas…','wait');
  let peer;try{peer=new P(NETPFX+'g'+Math.random().toString(36).slice(2,10),{debug:0,config:{iceServers:ICE}});}catch(e){netErr({type:'network'});return;}
  net.peer=peer;
  net.tm=setTimeout(()=>{if(!net.on){try{peer.destroy();}catch(e){}net.peer=null;netErr({type:'webrtc'});}},32000);
  let tries=0;
  const attempt=()=>{
    tries++;setNet(tries>1?'Buscando la sala '+code+'… (intento '+tries+')':'Buscando la sala '+code+'…','wait');
    const c=peer.connect(NETPFX+code,{reliable:true,serialization:'json'});net.hc=c;
    c.on('open',()=>{
      if(net.on&&net.hc!==c)return;
      clearTimeout(net.tm);net.on=true;net.host=false;net.code=code;net.busy=false;

    });

  };
  peer.on('error',e=>{
    if(e&&e.type==='peer-unavailable'&&!net.on&&tries<5){setNet('La sala no responde todavía, reintentando…','wait');setTimeout(()=>{if(!net.on&&net.peer===peer)attempt();},1600);return;}

}

  }else if(curPage==='set'){
    h='<h2>Ajustes</h2><div class="sl"><label>Volumen</label><input type="range" min="0" max="100" value="'+Math.round(S.master*100)+'" oninput="S.master=this.value/100;applyVol();saveS()"></div><div class="sl"><label>Música</label><input type="range" min="0" max="100" value="'+Math.round(S.music*100)+'" oninput="S.music=this.value/100;applyVol();saveS()"></div><div class="sl"><label>Efectos</label><input type="range" min="0" max="100" value="'+Math.round(S.sfx*100)+'" oninput="S.sfx=this.value/100;applyVol();saveS()"></div>'+

/* ---- héroe animado del menú ---- */
const HC=$('heroC'),HG=HC.getContext('2d');let hT=0,hI=0,hPrev=0;
function heroTick(){
  if($('menu').style.display==='none')return;
  const t=performance.now()/1000;if(t-hT>1.6){hT=t;hPrev=hI;hI=(hI+1+Math.floor(Math.random()*5))%PT.length;}
  const k=t-hT;HG.clearRect(0,0,260,260);HG.imageSmoothingEnabled=true;
  HG.fillStyle='rgba(212,169,80,.08)';HG.beginPath();HG.arc(130,150,100,0,7);HG.fill();
  const idx=k<.25?hPrev:hI,s=iconFor(idx,(idx>>1)%4,160),sc=Math.min(150/s.width,150/s.height);
  const bob=Math.sin(t*2)*4,pop=k<.25?1-k*4*.4:k<.45?.6+(k-.25)*2:1;
  HG.save();HG.translate(130,140+bob);HG.scale(pop,pop);HG.drawImage(s,-s.width*sc/2,-s.height*sc/2,s.width*sc,s.height*sc);HG.restore();
  if(k<.5){for(let i=0;i<8;i++){const a=i*.8+t,r=(k/.5)*60;HG.fillStyle='rgba(255,255,255,'+(1-k/.5)*.6+')';HG.beginPath();HG.arc(130+Math.cos(a)*r,140+Math.sin(a)*r,6*(1-k/.5)+1,0,7);HG.fill();}}
  $('heroName').textContent=PT[idx].n;$('heroSkin').textContent='¿Mueble o escondido?';
}
/* ---- intro ---- */
function playIntro(done){
  const el=document.createElement('div');el.id='intro';el.innerHTML='<canvas></canvas><div class="skip">TOCA PARA SALTAR ▸</div>';document.body.appendChild(el);
  const c=el.firstChild,g=c.getContext('2d');let t0=performance.now(),fin=false;
  const fit=()=>{const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);};fit();addEventListener('resize',fit);
  const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),fade=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/.5),Math.max(0,(b-t)/.5));
  const props=[0,3,4,5,16,19,22,8];
  function fr(now){
    if(fin)return;const t=(now-t0)/1000,W=innerWidth,H=innerHeight,u=Math.min(W,H*1.6)/600;
    g.globalAlpha=1;g.fillStyle='#07050a';g.fillRect(0,0,W,H);
    g.textAlign='center';g.textBaseline='middle';const cx=W/2,cy=H/2;
    let a=fade(t,.2,2.8);
    if(a>0){g.globalAlpha=a;g.fillStyle='#d4a950';g.font='600 '+13*u+'px Rajdhani,system-ui,sans-serif';g.fillText('— PRESENTA —',cx,cy-60*u);
      g.fillStyle='#fff';g.font='700 '+Math.min(58*u,W/9)+'px Rajdhani,system-ui,sans-serif';g.shadowColor='#9a1f33';g.shadowBlur=24*u;g.fillText('PIXEL ARTS',cx,cy);g.shadowBlur=0;
      g.fillStyle='#d4a950';g.fillRect(cx-110*u*ease((t-.6)/.8),cy+36*u,220*u*ease((t-.6)/.8),3*u);g.globalAlpha=1;}
    a=fade(t,2.8,5.6);
    if(a>0){g.globalAlpha=a;const k=(t-2.8)/2.8;g.imageSmoothingEnabled=true;
      props.forEach((ti_,i)=>{const s=iconFor(ti_,i%4,96),sc=(s.width>80?1.1:2.6)*u,x=W*(.1+.8*(i/(props.length-1))),y=H*.55+Math.sin(t*2+i)*6*u*(k>.4?1:0);const trans=ease((k-i*.07-.1)*2.5);g.save();g.translate(x,y);g.globalAlpha=a*Math.min(1,trans*2);g.scale(sc*(.5+.5*trans),sc*(.5+.5*trans));g.drawImage(s,-s.width/2,-s.height/2);g.restore();});
      g.fillStyle='#fff';g.font='700 '+24*u+'px Rajdhani,system-ui,sans-serif';g.fillText('Cuatro lugares · mil objetos · un solo buscador',cx,H*.25);g.globalAlpha=1;}
    const tt=t-5.6;
    if(tt>0){const p=ease(tt/.6);g.save();g.translate(cx,cy);g.scale(.7+.3*p,.7+.3*p);g.globalAlpha=p;g.font='700 '+Math.min(92*u,W/9)+'px Rajdhani,system-ui,sans-serif';g.shadowColor='#9a1f33';g.shadowBlur=30*u;g.fillStyle='#fff';g.fillText('ESCONDITES',0,-8*u);g.shadowBlur=0;g.fillStyle='#d4a950';g.font='700 '+19*u+'px Rajdhani,system-ui,sans-serif';g.fillText('E S C Ó N D E T E   ·   T R A N S F Ó R M A T E   ·   S O B R E V I V E',0,50*u);g.restore();
      if(tt>1.2){g.fillStyle='rgba(212,169,80,'+(.4+.5*Math.abs(Math.sin(t*3)))+')';g.font='600 '+15*u+'px Rajdhani,system-ui,sans-serif';g.fillText('TOCA PARA COMENZAR',cx,H*.9);}
      if(tt>4.2)finish();}
    requestAnimationFrame(fr);
  }
  function finish(){if(fin)return;fin=true;el.style.transition='opacity .5s';el.style.opacity=0;setTimeout(()=>{el.remove();removeEventListener('resize',fit);done();},500);}
  el.addEventListener('pointerdown',()=>{try{audioInit();}catch(e){}finish();});
  addEventListener('keydown',function k(e){if(!fin){finish();}removeEventListener('keydown',k);});
  requestAnimationFrame(fr);
}
function boot(){
  document.addEventListener('pointerdown',()=>{try{audioInit();}catch(e){}});
  try{applyVol();}catch(e){}musInitStored();refreshNav();goPage('home');setMusic('menu');
  addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='joinIn')joinRoom();});
}
try{GLR.init();}catch(e){console.error(e);}
resize();requestAnimationFrame(frame);
$('menu').style.display='none';
if(window.__NOINTRO){$('menu').style.display='flex';boot();}else playIntro(()=>{$('menu').style.display='flex';boot();});
